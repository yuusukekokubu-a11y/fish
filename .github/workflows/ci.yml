# GitHub のテストの設定(D-005・D-015・D-026〜D-028)。
# - PR:速いテスト。計算本体が変わったときだけ重いテストも。
# - main への取り込み後:速いテストだけ。
# - 手動の実行(workflow_dispatch):重いテスト。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じ PR を出し直したときは、古い実行を止める。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  fast:
    name: 速いテスト
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 外部の部品がないので、npm install は要らない。テストのファイルは並列で回る。
      - run: npm test

  changes:
    name: 重いテストが要るかの判定
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needs_slow: ${{ steps.decide.outputs.needs_slow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed_files.txt
          echo "変わったファイル:"
          cat changed_files.txt
          node scripts/ci_needs_slow.mjs < changed_files.txt

  slow:
    name: 重いテスト
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.needs_slow == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run test:slow

  # ほかのジョブの結果をまとめる。取り込みの可否はこのジョブで判断する(D-015)。
  ci-result:
    name: ci-result
    needs: [fast, changes, slow]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "結果:$RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "失敗または中止のジョブがあります。"
              exit 1
            fi
          done
          echo "すべて成功(または不要のため省略)です。"
