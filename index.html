<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3954" />
    <title>fish</title>
    <link rel="stylesheet" href="src/ui/screens.css" />
    <link rel="stylesheet" href="src/ui/debug.css" />
    <link rel="stylesheet" href="src/ui/bait.css" />
    <link rel="stylesheet" href="src/ui/glove.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b3954;
        color: #fff;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 上(数)・真ん中(釣りの絵)・下(竿のボタン)の 3 段(D-051)。メニューは右から重ねて出す(D-130)。 */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: 480px;
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        touch-action: manipulation;
      }
      #hud {
        padding: calc(env(safe-area-inset-top) + 8px) 8px 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 15px;
      }
      #hud-row {
        display: flex;
        justify-content: space-around;
        gap: 8px;
        white-space: nowrap;
      }
      #hud b {
        font-size: 19px;
      }
      /* 2 段目:いまいる釣り場の名前と、竿の名前(釣り場の中の段階つき:D-272)。 */
      #hud-sub {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: 8px;
        margin-top: 2px;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
      }
      #area-name {
        padding: 0 6px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        font-weight: bold;
      }
      #rod-name {
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.8;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        /* 合わせと命中の領域:ダブルタップの拡大・スクロール・長押しの選択とメニューを出さない(D-284)。 */
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 確かめ用の表示(?debug のときだけ:D-286)。押せない小さな文字で、左下の隅に。 */
      #perf {
        position: absolute;
        left: 6px;
        bottom: 6px;
        z-index: 25;
        padding: 3px 6px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #e9f5db;
        font: 14px/1.3 ui-monospace, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #perf[hidden] {
        display: none;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #message {
        position: absolute;
        top: 12%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 6px);
        background: rgba(0, 0, 0, 0.35);
      }
      #upgrade {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #upgrade:disabled {
        background: #44555f;
        color: #9fb3bf;
      }
      /* 餌のボタン(D-271):釣りの絵の左上に重ねる(☰ と同じ高さで左右対称)。出る・消えるで、ほかの部分は動かない。
         入っている状態は、色だけでなく、枠の実線と「✓」でも分かる(使わないときは点線)。 */
      #bait-toggle {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 30;
        min-width: 88px;
        min-height: 44px;
        padding: 3px 10px;
        border: 2px dashed #9fb3bf;
        border-radius: 10px;
        background: rgba(4, 30, 46, 0.7);
        color: #cfdde5;
        font: inherit;
        font-size: 14px;
        line-height: 1.25;
        text-align: center;
      }
      #bait-toggle[hidden] {
        display: none;
      }
      #bait-toggle[aria-pressed="true"] {
        border-style: solid;
        border-color: #7bdff2;
        background: #1b6f8a;
        color: #fff;
      }
      #bait-toggle:disabled {
        border-style: dotted;
        border-color: #6b7c86;
        background: rgba(4, 30, 46, 0.5);
        color: #9fb3bf;
      }
      #bait-toggle b {
        display: block;
        font-size: 15px;
      }
      /* 払い戻しなどの知らせ(数秒で消える)。 */
      #notice {
        position: absolute;
        top: 36%;
        left: 12px;
        right: 12px;
        text-align: center;
        font-size: 15px;
        font-weight: bold;
        color: #ffd166;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        white-space: pre-line;
        pointer-events: none;
      }
      #sub {
        display: flex;
        justify-content: flex-end;
        font-size: 11px;
        opacity: 0.7;
      }
      /* ドロワー(目次:D-130・D-134・D-152)。☰ は釣りの絵の右上。目次は上の数の欄の下から、右に出る。 */
      #menu-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 30;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: rgba(4, 30, 46, 0.7);
        color: #fff;
        font-size: 22px;
        line-height: 44px;
      }
      .drawer-backdrop {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        background: rgba(0, 0, 0, 0.45);
      }
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        width: 70%;
        max-width: 300px;
        padding: 60px 0 calc(env(safe-area-inset-bottom) + 12px);
        box-sizing: border-box;
        background: #062a3d;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
        transform: translateX(105%);
        transition: transform 0.2s ease-out;
        visibility: hidden;
        overflow-y: auto;
      }
      #app.menu-open .drawer-backdrop {
        display: block;
      }
      #app.menu-open .drawer {
        transform: translateX(0);
        visibility: visible;
      }
      .drawer-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .drawer-item {
        width: 100%;
        min-height: 56px;
        padding: 0 20px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: none;
        color: #fff;
        font: inherit;
        font-size: 17px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="hud-row">
          <span>ウロコイン <b id="coins">0</b></span>
          <span id="need"></span>
        </div>
        <div id="hud-sub"><span id="area-name"></span><span id="rod-name"></span></div>
      </div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="message"></div>
        <div id="notice" role="status"></div>
        <button id="bait-toggle" type="button" aria-pressed="false" hidden><b id="bait-count"></b><span id="bait-state"></span></button>
        <button id="menu-toggle" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">☰</button>
      </div>
      <div id="footer">
        <button id="upgrade" type="button"></button>
        <div id="sub">
          <span><span id="version"></span> / <span id="seed"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
