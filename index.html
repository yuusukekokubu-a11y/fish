<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3954" />
    <title>fish</title>
    <link rel="stylesheet" href="src/ui/screens.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b3954;
        color: #fff;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 上(数)・真ん中(釣りの絵)・下(竿のボタン)の 3 段(D-051)。メニューは右から重ねて出す(D-130)。 */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: 480px;
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        touch-action: manipulation;
      }
      #hud {
        padding: calc(env(safe-area-inset-top) + 8px) 8px 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 15px;
      }
      #hud-row {
        display: flex;
        justify-content: space-around;
        gap: 8px;
        white-space: nowrap;
      }
      #hud b {
        font-size: 19px;
      }
      #rod-name {
        margin-top: 2px;
        text-align: center;
        font-size: 11px;
        opacity: 0.75;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #message {
        position: absolute;
        top: 12%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 6px);
        background: rgba(0, 0, 0, 0.35);
      }
      #upgrade {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #upgrade:disabled {
        background: #44555f;
        color: #9fb3bf;
      }
      #sub {
        display: flex;
        justify-content: flex-end;
        font-size: 11px;
        opacity: 0.7;
      }
      /* ドロワー(目次:D-130・D-134・D-152)。☰ は釣りの絵の右上。目次は上の数の欄の下から、右に出る。 */
      #menu-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 30;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: rgba(4, 30, 46, 0.7);
        color: #fff;
        font-size: 22px;
        line-height: 44px;
      }
      .drawer-backdrop {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        background: rgba(0, 0, 0, 0.45);
      }
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        width: 70%;
        max-width: 300px;
        padding: 60px 0 calc(env(safe-area-inset-bottom) + 12px);
        box-sizing: border-box;
        background: #062a3d;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
        transform: translateX(105%);
        transition: transform 0.2s ease-out;
        visibility: hidden;
        overflow-y: auto;
      }
      #app.menu-open .drawer-backdrop {
        display: block;
      }
      #app.menu-open .drawer {
        transform: translateX(0);
        visibility: visible;
      }
      .drawer-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .drawer-item {
        width: 100%;
        min-height: 56px;
        padding: 0 20px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: none;
        color: #fff;
        font: inherit;
        font-size: 17px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="hud-row">
          <span>ウロコイン <b id="coins">0</b></span>
          <span id="need"></span>
        </div>
        <div id="rod-name"></div>
      </div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="message"></div>
        <button id="menu-toggle" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">☰</button>
      </div>
      <div id="footer">
        <button id="upgrade" type="button"></button>
        <div id="sub">
          <span><span id="version"></span> / <span id="seed"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
