<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4b2e17" />
    <title>fish</title>
    <link rel="stylesheet" href="src/ui/theme.css" />
    <link rel="stylesheet" href="src/ui/main.css" />
    <link rel="stylesheet" href="src/ui/screens.css" />
    <link rel="stylesheet" href="src/ui/equip.css" />
    <link rel="stylesheet" href="src/ui/crate.css" />
    <link rel="stylesheet" href="src/ui/skills.css" />
    <link rel="stylesheet" href="src/ui/debug.css" />
    <link rel="stylesheet" href="src/ui/bait.css" />
    <link rel="stylesheet" href="src/ui/glove.css" />
    <link rel="stylesheet" href="src/ui/kourin.css" />
  </head>
  <body>
    <div id="app" class="wall">
      <div id="hud" class="plank nailed">
        <div id="hud-row">
          <span class="hud-coins"><i class="px-coin" aria-hidden="true"></i><span class="hud-coins-label">ウロコイン</span> <b id="coins">0</b></span>
          <span id="need"></span>
        </div>
        <div id="hud-sub"><span id="area-name"></span><span id="rod-name"></span></div>
      </div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="message"></div>
        <div id="notice" role="status"></div>
        <button id="bait-toggle" type="button" aria-pressed="false" hidden><b id="bait-count"></b><span id="bait-state"></span></button>
        <button id="menu-toggle" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">☰</button>
      </div>
      <div id="footer" class="plank">
        <button id="upgrade" type="button"></button>
        <div id="sub">
          <span><span id="version"></span> / <span id="seed"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
