<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3954" />
    <title>fish</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b3954;
        color: #fff;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 上(数)・真ん中(釣りの絵)・下(竿のボタン)の 3 段(D-051)。メニューは右から重ねて出す(D-130)。 */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: 480px;
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        touch-action: manipulation;
      }
      #hud {
        padding: calc(env(safe-area-inset-top) + 8px) 8px 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 15px;
      }
      #hud-row {
        display: flex;
        justify-content: space-around;
        gap: 8px;
        white-space: nowrap;
      }
      #hud b {
        font-size: 19px;
      }
      #rod-name {
        margin-top: 2px;
        text-align: center;
        font-size: 11px;
        opacity: 0.75;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #message {
        position: absolute;
        top: 12%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 6px);
        background: rgba(0, 0, 0, 0.35);
      }
      #upgrade {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #upgrade:disabled {
        background: #44555f;
        color: #9fb3bf;
      }
      #sub {
        display: flex;
        justify-content: flex-end;
        font-size: 11px;
        opacity: 0.7;
      }
      /* ドロワーメニュー(D-130・D-134)。☰ は釣りの絵の右上。メニューは上の数の欄の下から、右に出る。 */
      #menu-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 30;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: rgba(4, 30, 46, 0.7);
        color: #fff;
        font-size: 22px;
        line-height: 40px;
      }
      .drawer-backdrop {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        background: rgba(0, 0, 0, 0.45);
      }
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        width: 85%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        background: #062a3d;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
        transform: translateX(105%);
        transition: transform 0.2s ease-out;
        visibility: hidden;
      }
      #app.menu-open .drawer-backdrop {
        display: block;
      }
      #app.menu-open .drawer {
        transform: translateX(0);
        visibility: visible;
      }
      .drawer-tabs {
        display: flex;
        gap: 4px;
        padding: 8px 56px 8px 8px;
        border-bottom: 1px solid #44555f;
      }
      .drawer-tab {
        flex: 1;
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #0b3954;
        color: #cfe3ee;
        font: inherit;
        font-size: 14px;
      }
      .drawer-tab.active {
        background: #ffd166;
        color: #3d2c00;
        font-weight: bold;
      }
      .drawer-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 12px);
      }
      .menu-header {
        padding: 6px 2px 10px;
        font-size: 16px;
        font-weight: bold;
      }
      .menu-section h3 {
        margin: 10px 2px 4px;
        font-size: 12px;
        font-weight: normal;
        opacity: 0.7;
      }
      .menu-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .menu-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: none;
        color: inherit;
        font: inherit;
        font-size: 14px;
        text-align: left;
      }
      .menu-row:disabled {
        color: #7f95a1;
      }
      .menu-value {
        font-weight: bold;
        white-space: nowrap;
      }
      .menu-detail {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        margin: 0;
        padding: 8px 12px 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 13px;
      }
      .menu-detail[hidden] {
        display: none;
      }
      .menu-detail dt {
        opacity: 0.7;
      }
      .menu-detail dd {
        margin: 0;
      }
      #reset {
        width: 100%;
        min-height: 40px;
        border: 1px solid #ff8fa3;
        border-radius: 8px;
        background: none;
        color: #ff8fa3;
        font: inherit;
        font-size: 14px;
      }
      #reset.armed {
        background: #ff8fa3;
        color: #3d0010;
        font-weight: bold;
      }
      #code-text {
        width: 100%;
        box-sizing: border-box;
        height: 88px;
        resize: none;
        border: 1px solid #44555f;
        border-radius: 8px;
        background: #0b3954;
        color: #fff;
        font: 12px ui-monospace, monospace;
        word-break: break-all;
        -webkit-user-select: text;
        user-select: text;
      }
      #code-buttons {
        display: flex;
        gap: 6px;
      }
      #code-buttons button {
        flex: 1;
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #code-status {
        min-height: 1.4em;
        padding: 4px 0;
        font-size: 13px;
        text-align: center;
      }
      #code-status.error {
        color: #ff8fa3;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="hud-row">
          <span>ウロコイン <b id="coins">0</b></span>
          <span id="need"></span>
        </div>
        <div id="rod-name"></div>
      </div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="message"></div>
        <button id="menu-toggle" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer">☰</button>
      </div>
      <div id="footer">
        <button id="upgrade" type="button"></button>
        <div id="sub">
          <span><span id="version"></span> / <span id="seed"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
