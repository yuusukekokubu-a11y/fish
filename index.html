<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3954" />
    <title>fish</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b3954;
        color: #fff;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 上(数)・真ん中(釣りの絵)・下(竿の強化)の 3 段(D-051)。 */
      #app {
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: 480px;
        height: 100%;
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        touch-action: manipulation;
      }
      #hud {
        padding: calc(env(safe-area-inset-top) + 8px) 8px 6px;
        background: rgba(0, 0, 0, 0.35);
        font-size: 15px;
      }
      #hud-row {
        display: flex;
        justify-content: space-around;
        gap: 8px;
        white-space: nowrap;
      }
      #hud b {
        font-size: 19px;
      }
      #rod-name {
        margin-top: 2px;
        text-align: center;
        font-size: 11px;
        opacity: 0.75;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #message {
        position: absolute;
        top: 12%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 10px calc(env(safe-area-inset-bottom) + 6px);
        background: rgba(0, 0, 0, 0.35);
      }
      #upgrade {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #upgrade:disabled {
        background: #44555f;
        color: #9fb3bf;
      }
      #sub {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        opacity: 0.7;
      }
      #reset {
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
      }
      #reset.armed {
        color: #ff8fa3;
        opacity: 1;
      }
      #sub button.link {
        border: 0;
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
      }
      /* セーブコードの小さな窓(D-066)。 */
      #code-panel {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(4, 30, 46, 0.96);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      #code-panel[hidden] {
        display: none;
      }
      #code-text {
        width: 100%;
        box-sizing: border-box;
        height: 72px;
        resize: none;
        border: 1px solid #44555f;
        border-radius: 8px;
        background: #0b3954;
        color: #fff;
        font: 12px ui-monospace, monospace;
        word-break: break-all;
        -webkit-user-select: text;
        user-select: text;
      }
      #code-buttons {
        display: flex;
        gap: 6px;
      }
      #code-buttons button {
        flex: 1;
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        background: #ffd166;
        color: #3d2c00;
        font: inherit;
        font-size: 14px;
        font-weight: bold;
      }
      #code-buttons button.plain {
        background: #44555f;
        color: #fff;
      }
      #code-status {
        min-height: 1em;
        font-size: 13px;
        text-align: center;
      }
      #code-status.error {
        color: #ff8fa3;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="hud-row">
          <span>ウロコイン <b id="coins">0</b></span>
          <span id="need"></span>
        </div>
        <div id="rod-name"></div>
      </div>
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="message"></div>
      </div>
      <div id="footer">
        <button id="upgrade" type="button"></button>
        <div id="sub">
          <button id="reset" type="button">データを消す</button>
          <button id="code-open" class="link" type="button">セーブコード</button>
          <span><span id="version"></span> / <span id="seed"></span></span>
        </div>
      </div>
      <div id="code-panel" hidden>
        <textarea id="code-text" spellcheck="false" autocomplete="off" aria-label="セーブコード"></textarea>
        <div id="code-status" role="status"></div>
        <div id="code-buttons">
          <button id="code-export" type="button">書き出し</button>
          <button id="code-copy" type="button">コピー</button>
          <button id="code-import" type="button">読み込み</button>
          <button id="code-close" class="plain" type="button">閉じる</button>
        </div>
      </div>
    </div>
    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
