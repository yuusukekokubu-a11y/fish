<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>ドット絵の見本</title>
    <style>
      /* ドット絵の見本の専用ページ(D-362)。ゲームの画面からはリンクしない。?debug の画面に入口が 1 つだけある。 */
      html,
      body {
        margin: 0;
        background: #0b1d2e;
        color: #fff;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
      }
      h1 {
        font-size: 20px;
        margin: 4px 0 8px;
      }
      p {
        margin: 6px 0;
      }
      .note {
        font-size: 14px;
        opacity: 0.85;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
      }
      .control-label {
        font-size: 14px;
        opacity: 0.85;
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choices button {
        min-width: 64px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        font: inherit;
        font-size: 15px;
      }
      .choices button[aria-pressed="true"] {
        background: #2f6fae;
        border-color: #7fb2e0;
      }
      .stage {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 8px;
        padding: 16px 4px;
        border-radius: 12px;
      }
      /* 3 つが横に入らない幅(スマホの縦画面など)は、縦に 1 列で並べる。 */
      @media (max-width: 600px) {
        .stage {
          flex-direction: column;
          align-items: center;
        }
      }
      .sample {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .sample canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .sample dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0 6px;
        margin: 0;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 8px;
        padding: 4px 8px;
      }
      .sample dt {
        opacity: 0.8;
      }
      .sample dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      .sample h2 {
        font-size: 16px;
        margin: 0;
        padding: 2px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
      }
      .section-title {
        margin-top: 28px;
      }
      /* 背景は、ゲームと同じ幅(390px)で見たいので、横の余白(16px)の外まで使う。 */
      .bg-stage {
        display: flex;
        justify-content: center;
        padding: 8px 0;
        margin: 0 -16px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: #9fd0ff;
        font-size: 15px;
      }
      .problems {
        color: #ff9aa2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ドット絵の見本(クロダイ)</h1>
      <p class="note">同じ魚を 32・64・128 マスの 3 つの粗さで描いたものです。粗さを決めるための見本で、ゲームにはまだ使っていません。</p>
      <div class="controls">
        <div>
          <div class="control-label">大きさ</div>
          <div class="choices" id="size-choices"></div>
        </div>
        <div>
          <div class="control-label">背景の色</div>
          <div class="choices" id="bg-choices"></div>
        </div>
      </div>
      <div class="stage" id="stage"></div>
      <p class="note" id="dpr-note"></p>
      <h1 class="section-title">背景の見本(港・昼)</h1>
      <p class="note">港の背景を、ゲームと同じ 1 ドット 3px(幅 130 ドット = 390px)で描いたものです。動きはありません。ゲームにはまだ使っていません。「ゲームの位置」で、水面・竿・ウキ・魚・ゲージの位置を重ねて、邪魔にならないかを見られます。</p>
      <div class="controls">
        <div>
          <div class="control-label">重ね方</div>
          <div class="choices" id="guide-choices"></div>
        </div>
      </div>
      <div class="bg-stage" id="bg-stage"></div>
      <p class="problems" id="problems" hidden></p>
      <a class="back" href="../../?debug">← ゲーム(?debug)に戻る</a>
    </main>
    <script type="module" src="./samples.js"></script>
  </body>
</html>
